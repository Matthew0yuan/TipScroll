[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tipscroll"
version = "0.1.0"
description = "A safe, fingertip-controlled vertical scroll prototype for Windows."
requires-python = ">=3.13"
dependencies = [
    "mediapipe==0.10.31",
    "numpy>=2.3,<3",
    "opencv-python>=4.12,<5",
    "Pillow>=11,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[project.scripts]
tipscroll = "tipscroll.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

